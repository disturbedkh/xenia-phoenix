name: Linux (ARM64)

on:
  workflow_call:

jobs:
  build:
    runs-on: ubuntu-24.04-arm

    env:
      LLVM_VERSION: 20

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Install dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq \
            build-essential ninja-build cmake pkg-config git python3 \
            libgtk-3-dev libsdl2-dev libvulkan-dev libx11-xcb-dev \
            libasound2-dev libfontconfig1-dev liblz4-dev \
            clang-20 lld-20 llvm-20 spirv-tools xvfb
          sudo update-alternatives --install /usr/bin/clang clang /usr/bin/clang-20 200
          sudo update-alternatives --install /usr/bin/clang++ clang++ /usr/bin/clang++-20 200

      - name: Download submodules
        run: git submodule update --init --depth=1

      - name: Build Release
        run: |
          export CC=clang CXX=clang++
          ./xenia-build.py setup
          ./xenia-build.py build --config=release --target=xenia-app --build-tests

      - name: Smoke
        run: |
          BIN=build/bin/Linux/Release/xenia_canary
          test -f "$BIN"
          chmod +x "$BIN"
          xvfb-run -a "$BIN" --help

      - name: CPU tests
        run: |
          cd build/bin/Linux/Release
          ./xenia-cpu-tests

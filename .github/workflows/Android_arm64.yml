name: Android arm64

on:
  workflow_call:
  push:
    branches: [canary_experimental, main]
    paths:
      - 'src/**'
      - 'cmake/**'
      - 'third_party/**'
      - 'CMakeLists.txt'
      - 'android/**'
      - '.github/workflows/Android_arm64.yml'
  pull_request:
    paths:
      - 'src/**'
      - 'cmake/**'
      - 'third_party/**'
      - 'CMakeLists.txt'
      - 'android/**'
      - '.github/workflows/Android_arm64.yml'

jobs:
  ndk-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install build tools
        run: sudo apt-get update && sudo apt-get install -y spirv-tools glslang-tools ninja-build cmake python3

      - name: Install NDK
        uses: nttld/setup-ndk@v1
        with:
          ndk-version: r26c
          add-to-path: true

      - name: Build xenia-app (Android arm64)
        run: python3 xenia-build.py build --target-os android --config=release --target app

      - name: Upload libxenia-app.so
        uses: actions/upload-artifact@v4
        with:
          name: xenia-app-android-arm64
          path: Build/Android/Release/libxenia-app.so

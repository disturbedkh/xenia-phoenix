name: macOS (Apple Silicon)

on:
  workflow_call:
    inputs:
      run_cpu_tests:
        description: 'Run xenia-cpu-tests after build'
        required: false
        default: true
        type: boolean

jobs:
  build:
    runs-on: macos-15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Install Vulkan SDK
        run: |
          if [ ! -d "$HOME/vulkan-sdk" ]; then
            curl -sSLo /tmp/vulkan-sdk.dmg https://sdk.lunarg.com/sdk/download/latest/mac/vulkan-sdk.dmg
            hdiutil attach /tmp/vulkan-sdk.dmg
            cp -R /Volumes/VulkanSDK/*/InstallVulkan.app /tmp/InstallVulkan.app
            hdiutil detach /Volumes/VulkanSDK/* || true
            /tmp/InstallVulkan.app/Contents/MacOS/InstallVulkan \
              --accept-licenses --default-answer --confirm-command install \
              --root "$HOME/vulkan-sdk"
          fi
          VULKAN_SDK="$(find "$HOME/vulkan-sdk" -maxdepth 2 -name macOS -type d | head -n1)"
          if [ -z "$VULKAN_SDK" ]; then
            VULKAN_SDK="$(find "$HOME/vulkan-sdk" -maxdepth 3 -type d -name include | head -n1 | xargs dirname)"
          fi
          echo "VULKAN_SDK=$VULKAN_SDK" >> "$GITHUB_ENV"
          echo "PATH=$VULKAN_SDK/bin:$PATH" >> "$GITHUB_ENV"
          echo "DYLD_LIBRARY_PATH=$VULKAN_SDK/lib:$DYLD_LIBRARY_PATH" >> "$GITHUB_ENV"
          echo "VK_ICD_FILENAMES=$VULKAN_SDK/share/vulkan/icd.d/MoltenVK_icd.json" >> "$GITHUB_ENV"

      - name: Download submodules
        run: git submodule update --init --depth=1

      - name: Configure
        run: |
          cmake -S . -B Build/macOS/ARM64 -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DXENIA_BUILD_TESTS=ON \
            -DXENIA_BUILD_MISC=ON

      - name: Build
        run: cmake --build Build/macOS/ARM64 --target xenia_canary xenia-cpu-tests --parallel

      - name: Verify
        run: ./tools/tier0/macos-verify.sh

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: xenia_canary_macos_arm64
          path: Build/macOS/ARM64/Release/xenia_canary
          if-no-files-found: error

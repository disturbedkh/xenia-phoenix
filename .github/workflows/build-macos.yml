name: macOS (Apple Silicon)

on:
  workflow_call:
    inputs:
      run_cpu_tests:
        description: 'Run xenia-cpu-tests after build'
        required: false
        default: true
        type: boolean

jobs:
  build:
    runs-on: macos-15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Install Vulkan SDK
        run: |
          brew install molten-vk vulkan-headers glslang spirv-tools
          echo "$(brew --prefix)/bin" >> "$GITHUB_PATH"
          SPIRV_OPT="$(command -v spirv-opt)"
          VULKAN_SDK="$(dirname "$(dirname "$SPIRV_OPT")")"
          echo "VULKAN_SDK=$VULKAN_SDK" >> "$GITHUB_ENV"
          ICD="$(find "$(brew --prefix molten-vk)" -name MoltenVK_icd.json | head -n1)"
          if [ -n "$ICD" ]; then
            echo "VK_ICD_FILENAMES=$ICD" >> "$GITHUB_ENV"
          fi
          echo "DYLD_LIBRARY_PATH=$(brew --prefix molten-vk)/lib:${DYLD_LIBRARY_PATH:-}" >> "$GITHUB_ENV"

      - name: Download submodules
        run: git submodule update --init --depth=1

      - name: Configure
        run: |
          cmake -S . -B Build/macOS/ARM64 -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DXENIA_BUILD_TESTS=ON \
            -DXENIA_BUILD_MISC=ON

      - name: Build
        run: cmake --build Build/macOS/ARM64 --target xenia_canary xenia-cpu-tests --parallel

      - name: Verify
        run: ./tools/tier0/macos-verify.sh

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: xenia_canary_macos_arm64
          path: Build/macOS/ARM64/Release/xenia_canary
          if-no-files-found: error

name: Windows (ARM64)

on:
  workflow_call:
    inputs:
      run_cpu_tests:
        description: 'Run xenia-cpu-tests after build'
        required: false
        default: true
        type: boolean

jobs:
  build:
    runs-on: windows-2025

    env:
      POWERSHELL_TELEMETRY_OPTOUT: 1

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Cache Vulkan SDK
        id: cache-vulkan-sdk
        uses: actions/cache@v5
        with:
          path: C:\VulkanSDK
          key: ${{ runner.os }}-vulkan-sdk-${{ hashFiles('**/vulkan-sdk.exe') }}
          restore-keys: |
            ${{ runner.os }}-vulkan-sdk-

      - name: Install Vulkan SDK
        run: |
          if (Test-Path -Path "C:\VulkanSDK") {
            echo "Vulkan SDK found in cache."
          } else {
            Invoke-WebRequest -Uri "https://sdk.lunarg.com/sdk/download/latest/windows/vulkan-sdk.exe" -OutFile "vulkan-sdk.exe"
            Start-Process -FilePath "vulkan-sdk.exe" -ArgumentList "--accept-licenses", "--default-answer", "--confirm-command", "install" -Wait
          }
          $env:VULKAN_SDK = "C:\VulkanSDK\$(Get-ChildItem -Path 'C:\VulkanSDK' -Directory | Select-Object -First 1 -ExpandProperty Name)"
          $env:PATH = "$env:VULKAN_SDK\Bin;$env:PATH"
          echo "VULKAN_SDK=$env:VULKAN_SDK" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          echo "$env:VULKAN_SDK\Bin" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append

      - name: Download submodules
        run: git submodule update --init --depth=1 -j $env:NUMBER_OF_PROCESSORS

      - name: Setup ARM64 build
        run: python xenia-build.py setup --target-arch arm64

      - name: Build Xenia (ARM64)
        run: |
          python xenia-build.py build --target-arch arm64 --config=release --target=xenia-app --build-tests

      - name: Verify ARM64 binary
        run: |
          $exe = "build-arm64\bin\Windows\Release\xenia_canary.exe"
          if (-not (Test-Path $exe)) { Write-Error "Missing $exe"; exit 1 }
          if ((Get-Item $exe).Length -le 100000) { Write-Error "Executable too small."; exit 1 }

      - name: ARM64 smoke and cpu-tests
        shell: pwsh
        run: |
          if ('${{ inputs.run_cpu_tests }}' -eq 'true') {
            ./tools/tier0/arm64-verify.ps1 -BuildDir build-arm64 -Config Release
          } else {
            ./tools/tier0/arm64-verify.ps1 -BuildDir build-arm64 -Config Release -SkipCpuTests
          }

      - name: Upload ARM64 artifact
        if: success()
        uses: actions/upload-artifact@v7
        with:
          name: xenia_canary_windows_arm64
          path: build-arm64/bin/Windows/Release/xenia_canary.exe
          if-no-files-found: error
          retention-days: 7

      - name: Upload build log on failure
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: arm64-build-failure-logs
          path: |
            build-arm64/**/*.log
          if-no-files-found: ignore
          retention-days: 3

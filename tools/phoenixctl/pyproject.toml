[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "phoenixctl"
version = "1.0.0"
description = "Phoenix CLI for Xenia telemetry, launch, and Tier 0 gates"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "pyyaml>=6.0",
]

[project.optional-dependencies]
dev = ["pytest>=7.0"]

[project.scripts]
phoenixctl = "phoenixctl.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["phoenixctl*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

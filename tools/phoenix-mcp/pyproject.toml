[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "phoenix-mcp"
version = "1.0.0"
description = "MCP server for Phoenix Xenia telemetry and control"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "mcp>=1.0.0",
]

[project.scripts]
phoenix-mcp = "phoenix_mcp.server:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["phoenix_mcp*"]
